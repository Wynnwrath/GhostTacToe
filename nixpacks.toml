providers = ['...', 'python']

[phases.setup]
nixPkgs = ['...']

[phases.install]
cmds = [
    'pip install -r server/requirements.txt',
    'npm install --prefix client'
]

[phases.build]
cmds = ['npm run build --prefix client']

[start]
cmd = 'cd server && python -m uvicorn main:socket_app --host 0.0.0.0 --port ${PORT:-8000}'
