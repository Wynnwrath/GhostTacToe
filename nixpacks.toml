[phases.setup]
aptPkgs = ['python3', 'python3-pip', 'python3-venv']
nixPkgs = ['...']

[phases.install]
cmds = [
    'pip3 install -r server/requirements.txt',
    'npm install --prefix client'
]

[phases.build]
cmds = ['npm run build --prefix client']

[start]
cmd = 'cd server && python3 -m uvicorn main:socket_app --host 0.0.0.0 --port ${PORT:-8000}'
