[phases.setup]
aptPkgs = ['python3', 'python3-pip', 'python3-venv', 'python3-full']
nixPkgs = ['...']

[phases.install]
cmds = [
    'python3 -m venv /opt/venv',
    '/opt/venv/bin/pip install -r server/requirements.txt',
    'npm install --prefix client'
]

[phases.build]
cmds = ['npm run build --prefix client']

[start]
cmd = 'cd server && /opt/venv/bin/python -m uvicorn main:socket_app --host 0.0.0.0 --port ${PORT:-8000}'
