version: "3.8"

services:
  server:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    restart: always
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/ghosttactoe
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
